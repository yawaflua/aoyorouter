syntax = "proto3";

package aoyorouter.docs.api.v1;

import "docs/api/v1/types.proto";
import "google/api/annotations.proto";
import "google/protobuf/empty.proto";

option go_package = "github.com/yawaflua/aoyorouter/pkg/pb/api/aoyorouter;aoyorouter";

service AoyoRouterService {
    rpc HealthCheck(google.protobuf.Empty) returns (HealthCheckResponse) {
        option (google.api.http) = {
            get: "/api/aoyo/v1/healthz"
        };
    }

    rpc SignIn(SignInRequest) returns (SignInResponse) {
        option (google.api.http) = {
            post: "/api/aoyo/v1/signin"
            body: "*"
        };
    }

    rpc CreateProvider(CreateProviderRequest) returns (CreateProviderResponse) {
        option (google.api.http) = {
            post: "/api/aoyo/v1/providers"
            body: "*"
        };
    }

    rpc CreateProviderAuthorization(CreateProviderAuthorizationRequest) returns (CreateProviderAuthorizationResponse) {
        option (google.api.http) = {
            post: "/api/aoyo/v1/providers/authorize"
            body: "*"
        };
    }

    rpc CompleteProviderAuthorization(CompleteProviderAuthorizationRequest) returns (ProviderAuthorizationStatusResponse) {
        option (google.api.http) = {
            post: "/api/aoyo/v1/providers/authorize/complete"
            body: "*"
        };
    }

    rpc GetProviderAuthorizationStatus(GetProviderAuthorizationStatusRequest) returns (ProviderAuthorizationStatusResponse) {
        option (google.api.http) = {
            get: "/api/aoyo/v1/providers/authorize/{state}"
        };
    }

    rpc GetProvider(GetProviderRequest) returns (GetProviderResponse) {
        option (google.api.http) = {
            get: "/api/aoyo/v1/providers/{provider_id}"
        };
    }

    rpc GetProvidersList(GetProvidersListRequest) returns (GetProvidersListResponse) {
        option (google.api.http) = {
            get: "/api/aoyo/v1/providers"
        };
    }

    rpc ReloadProviders(google.protobuf.Empty) returns (google.protobuf.Empty) {
        option (google.api.http) = {
            post: "/api/aoyo/v1/providers/reload"
            body: "*"
        };
    }

    rpc UpdateProvider(UpdateProviderRequest) returns (UpdateProviderResponse) {
        option (google.api.http) = {
            patch: "/api/aoyo/v1/providers/{provider_id}"
            body: "*"
        };
    }

    rpc DeleteProvider(DeleteProviderRequest) returns (DeleteProviderResponse) {
        option (google.api.http) = {
            delete: "/api/aoyo/v1/providers/{provider_id}"
        };
    }

    rpc CreateApiKey(CreateApiKeyRequest) returns (CreateApiKeyResponse) {
        option (google.api.http) = {
            post: "/api/aoyo/v1/api-keys"
            body: "*"
        };
    }

    rpc EditApiKey(EditApiKeyRequest) returns (EditApiKeyResponse) {
        option (google.api.http) = {
            patch: "/api/aoyo/v1/api-keys/{api_key_id}"
            body: "*"
        };
    }

    rpc DeleteApiKey(DeleteApiKeyRequest) returns (DeleteApiKeyResponse) {
        option (google.api.http) = {
            delete: "/api/aoyo/v1/api-keys/{api_key_id}"
        };
    }

    rpc GetApiKeyList(GetApiKeyListRequest) returns (GetApiKeyListResponse) {
        option (google.api.http) = {
            get: "/api/aoyo/v1/api-keys"
        };
    }
    rpc RecreateApiKey(RecreateApiKeyRequest) returns (RecreateApiKeyResponse) {
        option (google.api.http) = {
            post: "/api/aoyo/v1/api-keys/{api_key_id}/recreate"
            body: "*"
        };
    }

    rpc GetUsageLogs(GetUsageLogsRequest) returns (GetUsageLogsResponse) {
        option (google.api.http) = {
            get: "/api/aoyo/v1/logs"
        };
    }

    rpc GetError(GetErrorRequest) returns (GetErrorResponse) {
        option (google.api.http) = {
            get: "/api/aoyo/v1/logs/errors/{error_id}"
        };
    }

    rpc GetErrors(GetErrorsRequest) returns (GetErrorsResponse) {
        option (google.api.http) = {
            get: "/api/aoyo/v1/logs/errors"
        };
    }

    rpc GetProviderLogsByKeyID(GetProviderLogsByKeyIDRequest) returns (GetProviderLogsByKeyIDResponse) {
        option (google.api.http) = {
            get: "/api/aoyo/v1/api-keys/{api_key_id}/logs"
        };
    }

    rpc GetProxies(GetProxiesRequest) returns (GetProxiesResponse) {
        option (google.api.http) = {
            get: "/api/aoyo/v1/proxies"
        };
    }

    rpc UpdateProxy(UpdateProxyRequest) returns (UpdateProxyResponse) {
        option (google.api.http) = {
            patch: "/api/aoyo/v1/proxies/{proxy_id}"
            body: "*"
        };
    }

    rpc Subscribe(SubscribeRequest) returns (SubscribeResponse) {
        option (google.api.http) = {
            post: "/api/aoyo/v1/notifications/subscribe"
            body: "*"
        };
    }

    rpc Unsubscribe(UnsubscribeRequest) returns (UnsubscribeResponse) {
        option (google.api.http) = {
            post: "/api/aoyo/v1/notifications/unsubscribe"
            body: "*"
        };
    }

    rpc ListSubscriptions(ListSubscriptionsRequest) returns (ListSubscriptionsResponse) {
        option (google.api.http) = {
            get: "/api/aoyo/v1/notifications/subscriptions"
        };
    }

    rpc GetPushConfig(GetPushConfigRequest) returns (GetPushConfigResponse) {
        option (google.api.http) = {
            get: "/api/aoyo/v1/notifications/config"
        };
    }

    rpc ListNotificationEvents(ListNotificationEventsRequest) returns (ListNotificationEventsResponse) {
        option (google.api.http) = {
            get: "/api/aoyo/v1/notifications/events"
        };
    }

}
